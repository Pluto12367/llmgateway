[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgateway"
dynamic = ["version"]
description = "LLMGateway — 自托管的 OpenAI 兼容 LLM 网关：多厂商路由与故障降级、按 key 配额/预算/限流、语义响应缓存、实时用量成本看板"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LLMGateway Contributors" }]
keywords = ["llm", "gateway", "proxy", "openai", "cache", "routing", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local = ["fastembed>=0.4"]  # 本地 ONNX 语义缓存嵌入（可选，缺省自动回退到内置 hash 嵌入）

[project.urls]
Homepage = "https://github.com/Pluto12367/llmgateway"
Issues = "https://github.com/Pluto12367/llmgateway/issues"

[project.scripts]
llmgateway = "llmgateway.cli:main"

[tool.setuptools.packages.find]
include = ["llmgateway*"]

[tool.setuptools.dynamic]
version = { attr = "llmgateway.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
